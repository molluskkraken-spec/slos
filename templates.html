<template id="login-view">
        <div class="login-wrapper">
            <div class="login-box shadow-card">
                <img src="images/aulogo.png" alt="AU Logo" style="width: 80px; margin-bottom: 10px;"> 
                <h2>Login to SLOS</h2>
                <br>
                    <div class="form-container">
                    <input type="text" id="username" autocomplete="username" placeholder="Username" class="au-input">
                    <div class="password-input-wrapper">
                        <input type="password" id="password" autocomplete="current-password" placeholder="Password" class="au-input">
                        <button type="button" class="password-toggle-btn" onclick="togglePasswordVisibility('password')">
                            🙈
                        </button>
                    </div>
                    <div style="display:flex; align-items:center; gap:8px; margin:8px 0;">
                        <input type="checkbox" id="remember-me" />
                        <label for="remember-me" style="font-size:0.9rem; color:#555; cursor:pointer;">Remember me</label>
                    </div>
                    <button onclick="handleLogin()" class="btn-blue-submit">Login</button>
                    <p id="error-msg" class="error-msg"></p>
                </div>
            </div>
        </div>
    </template>

    <template id="dashboard-view">
        <div class="dashboard-content">
            <div id="role-quick-nav" class="quick-nav"></div>

            <!-- Image cards on top (priority) -->
            <div class="info-grid" id="main-grid">
                <div class="info-card shadow-card"><img src="images/hymn.jpg" class="info-img"></div>
                <div class="info-card shadow-card"><img src="images/VMC.jpg" class="info-img"></div>
                <div class="info-card shadow-card notes-card-enhanced" id="notes-card-container">
                    <div>
                        <h4 style="margin: 0 0 10px 0; font-size: 1rem;">📝 Notes & Tasks</h4>
                        <!-- Tab buttons -->
                        <div style="display: flex; gap: 6px; margin-bottom: 10px;">
                            <button onclick="switchNoteTab('notes')" id="notesTabBtn" class="note-tab-btn active" style="flex: 1; padding: 6px; background: var(--au-blue); color: white; border: none; border-radius: 4px; cursor: pointer; font-weight: 600; font-size: 0.8rem;">📖 Notes</button>
                            <button onclick="switchNoteTab('checklist')" id="checklistTabBtn" class="note-tab-btn" style="flex: 1; padding: 6px; background: #ccc; color: #333; border: none; border-radius: 4px; cursor: pointer; font-weight: 600; font-size: 0.8rem;">✓ Checklist</button>
                        </div>
                    </div>

                    <!-- Notes Tab -->
                    <div id="notesTab" class="note-tab-content" style="display: flex; flex-direction: column; flex: 1; gap: 6px;">
                        <div id="quickNoteInput" contenteditable="true" data-placeholder="Write your notes here..." style="width: 100%; flex: 1; padding: 8px; border: 1px solid #e6e6e6; border-radius: 6px; font-size: 0.85rem; font-family: inherit; overflow-y: auto; background: white; min-height: 100px;"></div>
                        <!-- Rich text toolbar -->
                        <div style="display: flex; gap: 4px; flex-wrap: wrap;">
                            <button onclick="formatNoteText('bold')" title="Bold" style="padding: 4px 8px; background: #fff; border: 1px solid #ddd; border-radius: 3px; cursor: pointer; font-weight: bold; font-size: 0.75rem;">B</button>
                            <button onclick="formatNoteText('italic')" title="Italic" style="padding: 4px 8px; background: #fff; border: 1px solid #ddd; border-radius: 3px; cursor: pointer; font-style: italic; font-size: 0.75rem;">I</button>
                            <button onclick="formatNoteText('underline')" title="Underline" style="padding: 4px 8px; background: #fff; border: 1px solid #ddd; border-radius: 3px; cursor: pointer; text-decoration: underline; font-size: 0.75rem;">U</button>
                            <button onclick="openEmojiPicker('note')" title="Add emoji" style="padding: 4px 8px; background: #fff; border: 1px solid #ddd; border-radius: 3px; cursor: pointer; font-size: 0.8rem;">😊</button>
                            <select id="noteColorTag" onchange="applyNoteColor()" style="padding: 4px 6px; border: 1px solid #ddd; border-radius: 3px; font-size: 0.75rem;">
                                <option value="">Color</option>
                                <option value="red">🔴 Important</option>
                                <option value="orange">🟠 Urgent</option>
                                <option value="green">🟢 Study</option>
                                <option value="blue">🔵 Info</option>
                                <option value="purple">🟣 Idea</option>
                            </select>
                        </div>
                        <div style="display: flex; gap: 6px;">
                            <button onclick="saveQuickNote()" style="flex: 1; padding: 6px; background: var(--au-blue); color: white; border: none; border-radius: 4px; cursor: pointer; font-weight: 600; font-size: 0.8rem;">Save</button>
                            <div id="noteSaveStatus" style="flex: 1; text-align: center; font-size: 0.7rem; color: #666; padding: 6px;"></div>
                        </div>
                    </div>

                    <!-- Checklist Tab -->
                    <div id="checklistTab" class="note-tab-content" style="display: none; flex-direction: column; flex: 1; gap: 6px;">
                        <div id="checklistItems" style="flex: 1; overflow-y: auto; border: 1px solid #e6e6e6; border-radius: 4px; padding: 6px; background: white;"></div>
                        <div style="display: flex; gap: 6px;">
                            <input type="text" id="checklistInput" placeholder="Add task..." style="flex: 1; padding: 6px; border: 1px solid #ddd; border-radius: 4px; font-size: 0.8rem;">

    <template id="notifications-view">
        <div class="dashboard-content">
            <div class="page-nav-header">
                <button type="button" onclick="goBack()" class="nav-pill"><i class="fas fa-arrow-left"></i> Back</button>

                <h2 style="color: var(--au-blue); margin-bottom: 10px;">📋 Your Pending Tasks</h2>

            </div>

                <i class="fas fa-check-circle" style="font-size: 3rem; margin-bottom: 15px; display: block; opacity: 0.5;"></i>

            </div>
        </div>
    </template>

    <template id="notification-popup">
        <div id="notificationPopup" style="position: fixed; top: 20px; right: 20px; background: white; border-radius: 12px; box-shadow: 0 8px 32px rgba(0, 51, 170, 0.2); padding: 30px; max-width: 500px; z-index: 10000; animation: slideIn 0.4s ease;">
            <style>
                @keyframes slideIn {
                    from {
                        transform: translateX(400px);
                        opacity: 0;
                    }
                    to {
                        transform: translateX(0);
                        opacity: 1;
                    }
                }
            </style>
            <div style="display: flex; justify-content: space-between; align-items: flex-start; margin-bottom: 15px;">
                <h3 style="margin: 0; color: var(--au-blue); font-size: 1.2rem;">
                    <i class="fas fa-bell" style="margin-right: 8px;"></i>Pending Tasks
                </h3>
                <button onclick="closeNotificationPopup()" style="background: none; border: none; font-size: 1.3rem; cursor: pointer; color: #999;">×</button>
            </div>
            <div id="notificationPopupContent" style="max-height: 400px; overflow-y: auto;">
                <!-- Notification items will be inserted here -->
            </div>
            <button onclick="openNotificationsView()" style="margin-top: 20px; width: 100%; padding: 12px; background: var(--au-blue); color: white; border: none; border-radius: 6px; cursor: pointer; font-weight: 600;">
                View All Pending Tasks →
            </button>
        </div>
    </template>

    <template id="student-selector-view">
    <div class="dashboard-content">
        <div class="page-nav-header">
            <button onclick="renderApp()" class="nav-pill"><i class="fas fa-arrow-left"></i> Back</button>
        </div>

        <div class="form-card">
            <div class="form-header-band" style="background: linear-gradient(135deg, #4a90e2 0%, #357abd 100%);">
                <i class="fas fa-users"></i> Select Student
            </div>

            <div class="form-content-scroll" style="padding: 30px;">
                <div style="background: #f8f9fa; padding: 20px; border-radius: 10px; margin-bottom: 25px;">
                    <h3 style="margin-top: 0; color: var(--au-blue); font-size: 1.1rem;">Filter by Academic Details</h3>
                    
                    <div style="display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap: 15px;">
                        <div class="form-group" style="margin-bottom: 0;">
                            <label for="clusterSelect">Cluster</label>
                            <select id="clusterSelect" class="au-input" onchange="onClusterChange()">
                                <option value="">--Select Cluster--</option>
                            </select>
                        </div>

                        <div class="form-group" style="margin-bottom: 0;">
                            <label for="strandSelect">Strand</label>
                            <select id="strandSelect" class="au-input" onchange="onStrandChange()" disabled>
                                <option value="">--Select Strand--</option>
                            </select>
                        </div>

                        <div class="form-group" style="margin-bottom: 0;">
                            <label for="sectionSelect">Section</label>
                            <select id="sectionSelect" class="au-input" onchange="updateStudentList()" disabled>
                                <option value="">--Select Section--</option>
                            </select>
                        </div>

                        <div class="form-group" style="margin-bottom: 0;">
                            <label for="genderSelect">Gender</label>
                            <select id="genderSelect" class="au-input" onchange="updateStudentList()" disabled>
                                <option value="all">All</option>
                                <option value="boy">Boys</option>
                                <option value="girl">Girls</option>
                            </select>
                        </div>
                    </div>

<template id="create-teacher-view">
    <div class="create-account-page">
        <div class="page-nav-header">
            <button type="button" class="nav-pill" onclick="goBack()">
                <i class="fas fa-arrow-left"></i> Back
            </button>
            <div class="account-type-wrapper">
                <label for="admin-account-type-select-teacher" class="account-type-label">
                    <i class="fas fa-id-card"></i> Account Type:
                </label>
                <select id="admin-account-type-select-teacher" class="account-type-select" onchange="if(this.value==='teacher'){ openTeacherRegistration(); } else if(this.value==='student'){ openStudentRegistration(); }">
                    <option value="student">📚 Student Account Registration</option>
                    <option value="teacher">👨‍🏫 Teacher Account Registration</option>
                </select>
            </div>
        </div>

        <div class="form-card">
            <div class="form-header-band teacher-bg">
                <i class="fas fa-chalkboard-teacher"></i> Register New Teacher
            </div>

            <div class="form-content-scroll">
                <h3 class="section-header">Personal Information</h3>
                <div class="form-row">
                    <div class="form-group"><label>First Name</label><input type="text" id="t-fname"></div>
                    <div class="form-group"><label>Middle Name <span style="color: #999; font-size: 0.85rem;">(Optional)</span></label><input type="text" id="t-mname"></div>
                    <div class="form-group"><label>Last Name</label><input type="text" id="t-lname"></div>
                </div>
                <div class="form-row">
                    <div class="form-group"><label>Birthday</label><input type="date" class="au-input date-input" id="t-bday" onchange="calculateAgeFromBirthday('t')"></div>
                    <div class="form-group"><label>Age</label><input type="number" class="au-input" id="t-age" min="0" max="120" placeholder="Auto-calculated" onchange="calculateBirthdayFromAge('t')"></div>
                    <div class="form-group">
                        <label>Gender</label>
                        <div class="input-with-btn">
                            <select id="t-gender"></select>
                            <button class="btn-add-mini" onclick="addNewOption('gender')">+</button>
                            <button class="btn-del-mini" onclick="deleteCurrentOption('t-gender')"><i class="fas fa-trash"></i></button>
                        </div>
                    </div>
                </div>

                <h3 class="section-header">Personal Details</h3>
                <div class="form-row">
                    <div class="form-group" style="grid-column: 1/-1;"><label>Address</label><input type="text" id="t-address" placeholder="Complete address"></div>
                </div>

                <h3 class="section-header">Assignment Details</h3>
                <div class="form-row">
                    <div class="form-group">
                        <label>Cluster</label>
                        <select id="t-cluster" onchange="onTeacherClusterChange()">
                            <option value="">--Select Cluster--</option>
                        </select>
                    </div>
                </div>

                <div style="background: #f8f9fa; padding: 15px; border-radius: 8px; margin-bottom: 20px;">
                    <h4 style="margin-top: 0; color: var(--au-blue);">Strands & Sections to Handle</h4>
                    <div id="teacher-strand-sections-container" style="display: flex; flex-direction: column; gap: 15px;"></div>
                </div>

                <h3 class="section-header">Subjects to Handle</h3>
                <p style="font-size: 0.85rem; color: #666; margin-bottom: 10px;">
                    <i class="fas fa-info-circle"></i> Select subjects from the cluster. Only subjects available in the selected cluster will appear.
                </p>
                <div id="t-subjects-list" style="display: grid; grid-template-columns: repeat(auto-fill, minmax(200px, 1fr)); gap: 12px; padding: 10px 0;"></div>

                <h3 class="section-header">Login Credentials</h3>
                <div class="form-row">
                    <div class="form-group"><label>Username</label><input type="text" id="t-username" autocomplete="username"></div>
                    <div class="form-group">
                        <label>Password</label>
                        <div class="password-input-wrapper">
                            <input type="password" id="t-password" autocomplete="new-password">
                            <button type="button" class="password-toggle-btn" onclick="togglePasswordVisibility(this)">
                                🙈
                            </button>
                        </div>
                    </div>
                </div>

                <div style="background: #f0f8ff; padding: 20px; border-radius: 8px; border-left: 4px solid var(--au-blue); margin-top: 30px;">
                    <h3 style="margin-top: 0; color: var(--au-blue); display: flex; align-items: center; gap: 10px;">
                        <i class="fas fa-user-check"></i> Teacher Information Summary
                    </h3>
                    <div id="teacher-complete-summary" style="display: grid; gap: 15px; font-size: 0.95rem;">
                        <p style="color: #999; margin: 0; font-style: italic;">Fill in all fields above to see complete summary</p>
                    </div>
                </div>
            </div>

            <div class="form-footer">
                <button class="save-btn-full teacher-bg" onclick="saveTeacherAccount()">Create Teacher Account</button>
            </div>
        </div>
    </div>
</template>

    <template id="custom-dialog-template">
        <div class="custom-dialog-overlay" id="custom-dialog-overlay">
            <div class="custom-dialog-box shadow-card">
                <h3 id="custom-dialog-title">Enter Value</h3>
                <input type="text" id="custom-dialog-input" class="au-input" placeholder="Enter here..." />
                <div class="custom-dialog-buttons">
                    <button onclick="closeCustomDialog()" class="btn-gray">Cancel</button>
                    <button onclick="confirmCustomDialog()" class="btn-blue-submit">OK</button>
                </div>
            </div>
        </div>
    </template>
